<!DOCTYPE html>
<html>
<body>
<input id="name" type="text" placeholder="Your name" />
<button onclick="go()">Get Started</button>
<div id="out"></div>
<script>
function go() {
  var n = document.getElementById('name').value;
  document.getElementById('out').innerHTML = 'Hello ' + n;
}
</script>
</body>
</html>
